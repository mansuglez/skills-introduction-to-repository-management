name: Bug report
description: Report a bug in the project
title: ""
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this bug. Please fill in the details below so we can reproduce and fix it.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem clearly and concisely.
      placeholder: The app crashes when I click...
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
      placeholder: I expected the page to load without errors.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact steps to reproduce the issue.
      placeholder: |
        1. Open the app
        2. Click on the "Create" button
        3. See the error
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include browser, OS, version, or relevant context.
      placeholder: |
        - OS: Windows 11
        - Browser: Chrome 128
        - App version: 1.2.3

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add screenshots, logs, or anything else relevant.
      placeholder: Attach logs/screenshots here.
